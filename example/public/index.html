<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Waylo voice example</title>
    <link rel="icon" href="/brand/favicon.png" />
    <style>
      :root {
        --accent: #1377fc;
        color-scheme: light;
      }
      body {
        background: #fff;
        color: #18181b;
        font:
          16px/1.5 system-ui,
          sans-serif;
        max-width: 36rem;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      h1 {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .badge {
        display: inline-flex;
        padding: 0.375rem 0.5rem;
        border-radius: 0.5rem;
        background: #18181b;
      }
      .badge img {
        height: 28px;
      }
      button {
        font: inherit;
        padding: 0.5rem 1.25rem;
        border: 0;
        border-radius: 0.375rem;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #call[data-mode='hang-up'] {
        background: #c62828;
      }
      .muted {
        color: #555;
        font-size: 0.875rem;
      }
      #error,
      #end-summary[role='alert'] {
        color: #b00020;
      }
      #end-summary p {
        margin: 0.25rem 0;
      }

      .status-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }
      #status {
        font-weight: 600;
        margin: 0;
      }
      #timer {
        color: #555;
        font-variant-numeric: tabular-nums;
      }
      [data-state] {
        color: #757575;
      }
      [data-state='listening'] {
        color: #2e7d32;
      }
      [data-state='thinking'] {
        color: #b26a00;
      }
      [data-state='speaking'] {
        color: #1565c0;
      }
      [data-state='failed'] {
        color: #c62828;
      }

      #viz {
        display: flex;
        align-items: center;
        gap: 3px;
        height: 1.5rem;
      }
      #viz span {
        width: 4px;
        height: 30%;
        border-radius: 2px;
        background: currentColor;
        animation: bounce var(--speed) ease-in-out infinite alternate;
      }
      #viz span:nth-child(even) {
        animation-delay: -0.2s;
      }
      #viz[data-state='idle'],
      #viz[data-state='ended'] {
        opacity: 0.3;
      }
      #viz[data-state='connecting'],
      #viz[data-state='listening'] {
        --speed: 1.2s;
      }
      #viz[data-state='thinking'] {
        --speed: 0.25s;
      }
      #viz[data-state='speaking'] {
        --speed: 0.6s;
      }
      @keyframes bounce {
        to {
          height: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #viz span {
          animation: none;
        }
      }

      #state-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 0.375rem;
        font-size: 0.8rem;
      }
      #state-pills span {
        padding: 0.125rem 0.5rem;
        border-radius: 999px;
        background: #eee;
        color: #555;
      }
      #state-pills [data-value='connected'],
      #state-pills [data-value='listening'],
      #state-pills [data-value='on'],
      #state-pills [data-value='playing'] {
        background: #e3f4e4;
        color: #2e7d32;
      }
      #state-pills [data-value='reconnecting'],
      #state-pills [data-value='thinking'] {
        background: #fdf0d9;
        color: #b26a00;
      }
      #state-pills [data-value='speaking'] {
        background: #e1edfb;
        color: #1565c0;
      }
      #state-pills [data-value='blocked'],
      #state-pills [data-value='failed'] {
        background: #fde4e4;
        color: #c62828;
      }

      #events {
        max-height: 12rem;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>
        <span class="badge"><img src="/brand/logo.svg" alt="Waylo" /></span> Waylo voice example
      </h1>
      <p>Click Talk, allow the microphone, and wait for the agent's greeting.</p>
      <button id="call" type="button" data-mode="talk" data-testid="call-button" disabled>
        Talk
      </button>
      <div class="status-row">
        <div id="viz" data-state="idle" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <p id="status" role="status" data-state="idle" data-testid="agent-state"></p>
        <span id="timer"></span>
      </div>
      <p id="state-pills">
        <span data-value="idle">connection: idle</span>
        <span data-value="none">agent: none</span>
        <span data-value="off">mic: off</span>
        <span data-value="stopped">playback: stopped</span>
      </p>
      <p id="error" role="alert" hidden></p>
      <div id="end-summary" class="muted" data-testid="call-end" hidden></div>
      <details>
        <summary>Events</summary>
        <ol id="events" class="muted" reversed data-testid="event-log"></ol>
      </details>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
