name: Release

on:
  release:
    types: [published]

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      published: ${{ steps.published.outputs.published }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Check the tag and pre-release box match the package version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version=$(node -p "require('./packages/client/package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package version $version"
            exit 1
          fi
          case "$version" in
            *-*) suffix=true ;;
            *) suffix=false ;;
          esac
          if [ "$suffix" != "$PRERELEASE" ]; then
            echo "::error::Pre-release box ($PRERELEASE) does not match version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The first version was published by hand, and a re-run may follow a publish that went through.
      - name: Check whether npm already has this version
        id: published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@waylovoice/client@$VERSION" version > /dev/null 2>&1; then
            echo "::notice::@waylovoice/client@$VERSION is already on npm; nothing to publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm validate

      - run: pnpm test:pack

      # pnpm pack turns catalog: versions into real ones.
      - run: pnpm --dir packages/client pack --pack-destination "$RUNNER_TEMP/package"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    if: needs.verify.outputs.published == 'false'
    # npm trusted publishing only accepts GitHub-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      id-token: write

    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 ships npm 11.5.1 or later, which trusted publishing needs.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package

      # npm, not pnpm: npm's own CLI exchanges the GitHub identity for a publish token.
      - name: Publish to npm
        env:
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish "$RUNNER_TEMP"/package/waylovoice-client-*.tgz --access public --tag "$DIST_TAG"
